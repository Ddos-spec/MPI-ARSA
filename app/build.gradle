plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mpiarsa.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mpiarsa.app'
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
