plugins {
    id 'com.android.application'
}

def signingEnv = System.getenv()
def releaseSigningReady = [
        'ANDROID_KEYSTORE_PATH',
        'ANDROID_KEYSTORE_PASSWORD',
        'ANDROID_KEY_ALIAS',
        'ANDROID_KEY_PASSWORD'
].every { key -> signingEnv[key]?.trim() }

android {
    namespace 'com.mpiarsa.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mpiarsa.app'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(signingEnv['ANDROID_KEYSTORE_PATH'])
                storePassword signingEnv['ANDROID_KEYSTORE_PASSWORD']
                keyAlias signingEnv['ANDROID_KEY_ALIAS']
                keyPassword signingEnv['ANDROID_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}

def storylineRootUpdateFiles = [
        'index.html',
        'story.html',
        'meta.xml',
        'analytics-frame.html'
]

tasks.register('applyStorylineRootUpdate') {
    doLast {
        File wwwDir = file('src/main/assets/www')
        File patchDir = file('storyline-root-patch')
        File patchZip = file("${buildDir}/tmp/storyline-root-patch.zip")
        wwwDir.mkdirs()
        patchZip.parentFile.mkdirs()

        def patchParts = (0..4).collect { index ->
            new File(patchDir, String.format('patch.zip.b64.part%02d', index))
        }

        String encodedPatch = patchParts.collect { File part ->
            if (!part.isFile() || part.length() == 0) {
                throw new GradleException("Storyline patch chunk missing or empty: ${part.name}")
            }
            part.getText('UTF-8').trim()
        }.join('')

        patchZip.bytes = encodedPatch.decodeBase64()

        copy {
            from zipTree(patchZip)
            into wwwDir
            include storylineRootUpdateFiles
        }

        storylineRootUpdateFiles.each { String relativePath ->
            File destination = new File(wwwDir, relativePath)
            if (!destination.isFile() || destination.length() == 0) {
                throw new GradleException("Storyline root patch failed: ${relativePath}")
            }
            println "Applied MPI ARSA Storyline root patch: ${relativePath}"
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('applyStorylineRootUpdate')
}
