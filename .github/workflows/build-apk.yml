name: Build MPI ARSA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpi-arsa-build-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Storyline assets from known-good APK
        shell: bash
        run: |
          set -euo pipefail

          BASELINE_APK="dist/MPI-ARSA-v1.0.5.apk"
          test -s "$BASELINE_APK"

          rm -rf app/src/main/assets/www /tmp/mpi-arsa-baseline
          mkdir -p app/src/main/assets/www /tmp/mpi-arsa-baseline

          unzip -q "$BASELINE_APK" 'assets/www/*' -d /tmp/mpi-arsa-baseline
          test -s /tmp/mpi-arsa-baseline/assets/www/index.html

          cp -a /tmp/mpi-arsa-baseline/assets/www/. app/src/main/assets/www/

          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/story.html

          FILE_COUNT="$(find app/src/main/assets/www -type f | wc -l | tr -d ' ')"
          echo "Restored ${FILE_COUNT} Storyline files from ${BASELINE_APK}"

          if [ "$FILE_COUNT" -lt 50 ]; then
            echo "::error::Storyline baseline looks incomplete (${FILE_COUNT} files)."
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/story.html'
          unzip -l "$APK" | grep -q 'assets/arsa-enhancements.js'

          ls -lh "$APK"

      - name: Read app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        env:
          VERSION: ${{ steps.app.outputs.version }}
          VERSION_CODE: ${{ steps.app.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mpi-arsa-release
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/mpi-arsa-release/MPI-ARSA.apk
          (
            cd /tmp/mpi-arsa-release
            sha256sum MPI-ARSA.apk > MPI-ARSA.apk.sha256
          )
          cat > /tmp/mpi-arsa-release/build-info.txt <<EOF
          version=$VERSION
          versionCode=$VERSION_CODE
          sourceCommit=$GITHUB_SHA
          workflowRun=$GITHUB_RUN_ID
          buildType=client-delivery
          artifact=MPI-ARSA.apk
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPI-ARSA-apk
          path: /tmp/mpi-arsa-release/
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              /tmp/mpi-arsa-release/MPI-ARSA.apk \
              /tmp/mpi-arsa-release/MPI-ARSA.apk.sha256 \
              /tmp/mpi-arsa-release/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              /tmp/mpi-arsa-release/MPI-ARSA.apk \
              /tmp/mpi-arsa-release/MPI-ARSA.apk.sha256 \
              /tmp/mpi-arsa-release/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MPI ARSA v${VERSION}" \
              --notes "APK MPI ARSA v${VERSION} untuk distribusi proyek/klien."
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
