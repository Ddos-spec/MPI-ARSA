          story.html|1HWGzPbjnmHdo2kSxTjUo0BBObpnI_OTh
          EOF

          download_one() {
            local record="$1"
            local rel="${record%%|*}"
            local id="${record##*|}"
            local dst="app/src/main/assets/www/$rel"
            mkdir -p "$(dirname "$dst")"
            echo "Downloading $rel"
            curl --fail --location --silent --show-error \
              --retry 10 --retry-delay 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$dst"
            test -s "$dst"
          }
          export -f download_one
          xargs -P 6 -I{} bash -c 'download_one "$1"' _ {} < /tmp/storyline-files.txt

          FILE_COUNT="$(find app/src/main/assets/www -type f | wc -l)"
          echo "Storyline files bundled: $FILE_COUNT"
          test "$FILE_COUNT" -eq 111
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/html5/data/js/paths.js
          test -s app/src/main/assets/www/story_content/video_5ZKA5I6IQ9M_22_48_256x144.mp4

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPI-ARSA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
