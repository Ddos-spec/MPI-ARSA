name: Build MPI ARSA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Storyline source from Google Drive
        shell: bash
        run: |
          python -m pip install --upgrade pip gdown
          rm -rf story-download app/src/main/assets/www
          mkdir -p story-download app/src/main/assets/www

          DOWNLOAD_OK=0
          for attempt in 1 2 3 4 5; do
            echo "Storyline download attempt $attempt/5"
            if gdown --folder --continue 'https://drive.google.com/drive/folders/1FKjB-pHJzMMun4VvYgO-XwKdghfAvaYD' -O story-download; then
              DOWNLOAD_OK=1
              break
            fi
            echo "Google Drive throttled one of the files; retrying in 20 seconds..."
            sleep 20
          done

          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo 'Unable to download the complete Storyline folder after retries.'
            exit 1
          fi

          INDEX_FILE="$(find story-download -type f -name index.html -print -quit)"
          if [ -z "$INDEX_FILE" ]; then
            echo 'index.html not found after downloading Storyline folder'
            find story-download -maxdepth 5 -type f | sort
            exit 1
          fi
          STORY_ROOT="$(dirname "$INDEX_FILE")"
          cp -a "$STORY_ROOT"/. app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html
          test -d app/src/main/assets/www/html5
          test -d app/src/main/assets/www/story_content
          test -f app/src/main/assets/www/story_content/video_5ZKA5I6IQ9M_22_48_256x144.mp4
          FILE_COUNT="$(find app/src/main/assets/www -type f | wc -l)"
          echo "Storyline files bundled: $FILE_COUNT"
          test "$FILE_COUNT" -ge 100

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPI-ARSA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
