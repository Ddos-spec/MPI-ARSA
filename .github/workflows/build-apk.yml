name: Build MPI ARSA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Storyline assets from known-good APK
        id: restore
        shell: bash
        run: |
          set -euo pipefail

          BASELINE_APK="dist/MPI-ARSA-v1.0.5.apk"
          test -s "$BASELINE_APK"

          rm -rf app/src/main/assets/www /tmp/mpi-arsa-baseline
          mkdir -p app/src/main/assets/www /tmp/mpi-arsa-baseline

          unzip -q "$BASELINE_APK" 'assets/www/*' -d /tmp/mpi-arsa-baseline
          test -s /tmp/mpi-arsa-baseline/assets/www/index.html

          cp -a /tmp/mpi-arsa-baseline/assets/www/. app/src/main/assets/www/

          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/story.html

          FILE_COUNT="$(find app/src/main/assets/www -type f | wc -l | tr -d ' ')"
          echo "Restored ${FILE_COUNT} Storyline files from ${BASELINE_APK}"

          if [ "$FILE_COUNT" -lt 50 ]; then
            echo "::error::Storyline baseline looks incomplete (${FILE_COUNT} files)."
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: assemble
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'assets/www/index.html'
          unzip -l "$APK" | grep -q 'assets/www/story.html'
          unzip -l "$APK" | grep -q 'assets/arsa-enhancements.js'

          ls -lh "$APK"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MPI-ARSA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Record build result
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          mkdir -p verification
          cat > verification/build-status.txt <<EOF
          sourceCommit=${GITHUB_SHA}
          restore=${RESTORE_OUTCOME}
          assemble=${ASSEMBLE_OUTCOME}
          verify=${VERIFY_OUTCOME}
          upload=${UPLOAD_OUTCOME}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: record APK build status [skip ci]"
            git push origin main
          fi
