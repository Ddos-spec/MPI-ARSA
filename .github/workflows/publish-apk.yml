name: Publish APK

on:
  workflow_run:
    workflows: ["Runtime Smoke Test"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download runtime-tested APK
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mpi-arsa-tested
          gh run download "$RUNTIME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name MPI-ARSA-tested-apk \
            --dir /tmp/mpi-arsa-tested

          META="$(find /tmp/mpi-arsa-tested -type f -name source-build.env -print -quit)"
          APK="$(find /tmp/mpi-arsa-tested -type f -name app-debug.apk -print -quit)"
          test -s "$META"
          test -s "$APK"

          SOURCE_SHA="$(sed -n 's/^SOURCE_SHA=//p' "$META" | head -n 1)"
          BUILD_RUN_ID="$(sed -n 's/^BUILD_RUN_ID=//p' "$META" | head -n 1)"
          test -n "$SOURCE_SHA"
          test -n "$BUILD_RUN_ID"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0

      - name: Skip stale tested builds
        id: current
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet "$SOURCE_SHA" origin/main -- app build.gradle settings.gradle .github/workflows; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer app change exists; skipping this older tested APK."
          fi

      - name: Read app version
        id: app
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        if: steps.current.outputs.current == 'true'
        env:
          APK: ${{ steps.source.outputs.apk }}
          VERSION: ${{ steps.app.outputs.version }}
          VERSION_CODE: ${{ steps.app.outputs.version_code }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_RUN_ID: ${{ steps.source.outputs.build_run_id }}
          RUNTIME_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mpi-arsa-release
          cp "$APK" /tmp/mpi-arsa-release/MPI-ARSA.apk
          (
            cd /tmp/mpi-arsa-release
            sha256sum MPI-ARSA.apk > MPI-ARSA.apk.sha256
          )
          cat > /tmp/mpi-arsa-release/build-info.txt <<EOF
          version=$VERSION
          versionCode=$VERSION_CODE
          sourceCommit=$SOURCE_SHA
          buildWorkflowRun=$BUILD_RUN_ID
          runtimeWorkflowRun=$RUNTIME_RUN_ID
          buildType=debug-client-delivery
          artifact=MPI-ARSA.apk
          EOF

      - name: Publish or refresh GitHub Release
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              /tmp/mpi-arsa-release/MPI-ARSA.apk \
              /tmp/mpi-arsa-release/MPI-ARSA.apk.sha256 \
              /tmp/mpi-arsa-release/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              /tmp/mpi-arsa-release/MPI-ARSA.apk \
              /tmp/mpi-arsa-release/MPI-ARSA.apk.sha256 \
              /tmp/mpi-arsa-release/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "MPI ARSA v${VERSION}" \
              --notes "APK MPI ARSA v${VERSION} untuk distribusi proyek/klien. Runtime test Android sudah dijalankan sebelum publikasi."
          fi
