name: Publish Signed APK

on:
  workflow_run:
    workflows: ["Runtime Smoke Test"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-signed-apk
  cancel-in-progress: false

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download runtime-tested candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mpi-arsa-tested
          gh run download "$RUNTIME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name MPI-ARSA-tested-apk \
            --dir /tmp/mpi-arsa-tested

          META="$(find /tmp/mpi-arsa-tested -type f -name source-build.env -print -quit)"
          TEST_APK="$(find /tmp/mpi-arsa-tested -type f -name app-debug.apk -print -quit)"
          test -s "$META"
          test -s "$TEST_APK"

          SOURCE_SHA="$(sed -n 's/^SOURCE_SHA=//p' "$META" | head -n 1)"
          BUILD_RUN_ID="$(sed -n 's/^BUILD_RUN_ID=//p' "$META" | head -n 1)"
          test -n "$SOURCE_SHA"
          test -n "$BUILD_RUN_ID"

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "test_apk=$TEST_APK" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0

      - name: Ensure tested source is still current
        id: current
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin main

          if git diff --quiet "$SOURCE_SHA" origin/main -- app build.gradle settings.gradle .github/workflows; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Tested source is still current for application and release files."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer application/release change exists on main; this tested candidate will not be published."
          fi

      - name: Read app metadata
        id: app
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"

          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read version metadata from app/build.gradle" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse mutable version tags
        id: release
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists. Releases are immutable; bump versionName/versionCode for a new binary."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release signing configuration
        id: signing
        if: steps.current.outputs.current == 'true' && steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::warning::$key is not configured; production release publishing is disabled."
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Runtime-tested debug APK remains test-only. No debug binary will be published as a production release."
          fi

      - name: Restore exact Storyline assets from tested APK
        if: steps.signing.outputs.ready == 'true'
        env:
          TEST_APK: ${{ steps.source.outputs.test_apk }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mpi-arsa-unpacked app/src/main/assets/www
          mkdir -p /tmp/mpi-arsa-unpacked app/src/main/assets/www
          unzip -q "$TEST_APK" 'assets/www/*' -d /tmp/mpi-arsa-unpacked
          test -s /tmp/mpi-arsa-unpacked/assets/www/index.html
          cp -a /tmp/mpi-arsa-unpacked/assets/www/. app/src/main/assets/www/

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mpi-arsa-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify production APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          if "$AAPT" dump badging "$APK" | grep -q '^application-debuggable'; then
            echo "::error::Refusing to publish a debuggable APK."
            exit 1
          fi

      - name: Prepare immutable release assets
        if: steps.signing.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.app.outputs.version }}
          VERSION_CODE: ${{ steps.app.outputs.version_code }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BUILD_RUN_ID: ${{ steps.source.outputs.build_run_id }}
          RUNTIME_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mpi-arsa-release
          cp app/build/outputs/apk/release/app-release.apk /tmp/mpi-arsa-release/MPI-ARSA.apk
          (
            cd /tmp/mpi-arsa-release
            sha256sum MPI-ARSA.apk > MPI-ARSA.apk.sha256
          )
          cat > /tmp/mpi-arsa-release/build-info.txt <<EOF
          version=$VERSION
          versionCode=$VERSION_CODE
          sourceCommit=$SOURCE_SHA
          buildWorkflowRun=$BUILD_RUN_ID
          runtimeWorkflowRun=$RUNTIME_RUN_ID
          artifact=MPI-ARSA.apk
          EOF

      - name: Create immutable GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            /tmp/mpi-arsa-release/MPI-ARSA.apk \
            /tmp/mpi-arsa-release/MPI-ARSA.apk.sha256 \
            /tmp/mpi-arsa-release/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "MPI ARSA v${VERSION}" \
            --notes "Production-signed Android APK MPI ARSA v${VERSION}. Runtime matrix passed on API 21, 29, and 34. Source commit: ${SOURCE_SHA}."
