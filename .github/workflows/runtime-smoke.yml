name: Runtime Smoke Test

on:
  workflow_run:
    workflows: ["Build MPI ARSA APK"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]

    steps:
      - name: Download APK from triggering build
        uses: actions/download-artifact@v5
        with:
          name: MPI-ARSA-debug-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK="$(find apk -type f -name '*.apk' -print -quit)"
            test -n "$APK"

            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.mpiarsa.app
            adb shell monkey -p com.mpiarsa.app -c android.intent.category.LAUNCHER 1

            sleep 20

            adb logcat -d -v threadtime > runtime-logcat-api-${{ matrix.api-level }}.txt || true
            adb exec-out screencap -p > mpi-arsa-api-${{ matrix.api-level }}.png || true

            PID="$(adb shell pidof com.mpiarsa.app | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              echo "::error::MPI ARSA process died after launch on API ${{ matrix.api-level }}"
              tail -n 300 runtime-logcat-api-${{ matrix.api-level }}.txt || true
              exit 1
            fi

            if grep -q "Process: com.mpiarsa.app" runtime-logcat-api-${{ matrix.api-level }}.txt; then
              echo "::error::AndroidRuntime crash detected for MPI ARSA on API ${{ matrix.api-level }}"
              grep -A 80 -B 10 "Process: com.mpiarsa.app" runtime-logcat-api-${{ matrix.api-level }}.txt || true
              exit 1
            fi

            adb shell dumpsys activity activities | grep -q "com.mpiarsa.app/.MainActivity"
            echo "MPI ARSA is alive after 20 seconds on Android API ${{ matrix.api-level }} (PID $PID)."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-api-${{ matrix.api-level }}
          path: |
            runtime-logcat-api-${{ matrix.api-level }}.txt
            mpi-arsa-api-${{ matrix.api-level }}.png
          if-no-files-found: ignore
          retention-days: 14
