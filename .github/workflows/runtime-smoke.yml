name: Runtime Smoke Test

on:
  workflow_run:
    workflows: ["Build MPI ARSA APK"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]

    steps:
      - name: Download APK from exact triggering build
        uses: actions/download-artifact@v5
        with:
          name: MPI-ARSA-debug-apk
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install screenshot analyzer
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Prepare runtime smoke script
        shell: bash
        run: |
          cat > smoke-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          API_LEVEL="$1"
          APK="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.mpiarsa.app
          adb shell monkey -p com.mpiarsa.app -c android.intent.category.LAUNCHER 1

          READY=0
          for _ in $(seq 1 35); do
            if adb logcat -d -v brief | grep -q 'MPI-ARSA.*CONTENT_READY'; then
              READY=1
              break
            fi
            sleep 1
          done

          LOG="runtime-logcat-api-${API_LEVEL}.txt"
          SHOT="mpi-arsa-api-${API_LEVEL}.png"
          UI="uiautomator-api-${API_LEVEL}.xml"
          adb logcat -d -v threadtime > "$LOG" || true
          adb exec-out screencap -p > "$SHOT" || true
          adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window.xml "$UI" >/dev/null 2>&1 || true

          PID="$(adb shell pidof com.mpiarsa.app | tr -d '\r' || true)"
          if [ -z "$PID" ]; then
            echo "::error::MPI ARSA process died after launch on API ${API_LEVEL}"
            tail -n 300 "$LOG" || true
            exit 1
          fi

          if grep -q "Process: com.mpiarsa.app" "$LOG"; then
            echo "::error::AndroidRuntime crash detected for MPI ARSA on API ${API_LEVEL}"
            grep -A 80 -B 10 "Process: com.mpiarsa.app" "$LOG" || true
            exit 1
          fi

          if ! adb shell dumpsys activity activities | grep -q "com.mpiarsa.app/.MainActivity"; then
            echo "::error::MPI ARSA process is alive but MainActivity is not active on API ${API_LEVEL}"
            exit 1
          fi

          if [ "$READY" -ne 1 ]; then
            echo "::error::Storyline never signaled CONTENT_READY on API ${API_LEVEL}"
            tail -n 300 "$LOG" || true
            exit 1
          fi

          python3 - "$SHOT" <<'PY'
          import sys
          from PIL import Image, ImageStat

          path = sys.argv[1]
          image = Image.open(path).convert("RGB")
          sample = image.resize((160, 90))
          pixels = list(sample.getdata())
          near_black = sum(1 for r, g, b in pixels if max(r, g, b) < 12) / len(pixels)
          contrast = ImageStat.Stat(sample.convert("L")).stddev[0]

          print(f"screenshot near_black={near_black:.4f} contrast={contrast:.2f}")
          if near_black > 0.985 or contrast < 1.8:
              raise SystemExit("Screenshot appears blank or nearly uniform")
          PY

          echo "MPI ARSA rendered usable content on Android API ${API_LEVEL}."
          EOF
          chmod +x smoke-test.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash smoke-test.sh ${{ matrix.api-level }}

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-api-${{ matrix.api-level }}
          path: |
            runtime-logcat-api-${{ matrix.api-level }}.txt
            mpi-arsa-api-${{ matrix.api-level }}.png
            uiautomator-api-${{ matrix.api-level }}.xml
          if-no-files-found: ignore
          retention-days: 7

  prepare-release-candidate:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact APK that passed the runtime matrix
        uses: actions/download-artifact@v5
        with:
          name: MPI-ARSA-debug-apk
          path: release-candidate/apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach upstream source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -s release-candidate/apk/app-debug.apk
          cat > release-candidate/source-build.env <<EOF
          SOURCE_SHA=$SOURCE_SHA
          BUILD_RUN_ID=$BUILD_RUN_ID
          EOF

      - name: Upload tested release candidate
        uses: actions/upload-artifact@v4
        with:
          name: MPI-ARSA-tested-apk
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
